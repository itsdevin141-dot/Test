
name: Build FriendChat

on:
  workflow_dispatch:
  push:
    paths:
      - 'friendchat.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Extract ZIP
        run: unzip -q friendchat.zip -d source

      - name: Build Fabric Mod
        working-directory: source/friendchat/mod
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: FriendChat-1.21.11
          path: source/friendchat/mod/build/libs/*.jar
          
